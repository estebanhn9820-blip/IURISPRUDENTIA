<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IURISPRUDENTIA</title>
<style>:root{--fondo:#f7f4ee;--dorado:#8b6f33;--texto:#1f2937;--gris:#6b7280;--borde:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--fondo);color:var(--texto);font-family:Arial,sans-serif;line-height:1.5}.container{max-width:1100px;margin:auto;padding:20px}header{background:white;border-bottom:1px solid var(--borde);position:sticky;top:0}.logo h1{margin:0;font-family:Georgia,serif;font-size:38px}.hero{padding:70px 20px}.hero h2{font-family:Georgia,serif;font-size:56px;margin:20px 0}.gold{color:var(--dorado)}.hero p,.intro{color:var(--gris);max-width:750px}.button{display:inline-block;padding:12px 18px;border:1px solid var(--dorado);border-radius:8px;background:var(--dorado);color:white;font-weight:bold;cursor:pointer;text-decoration:none}.button.secondary{background:white;color:var(--dorado)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:35px}.stat{background:white;border:1px solid var(--borde);border-radius:10px;text-align:center;padding:15px}.stat strong{display:block;color:var(--dorado);font-size:32px}.section{padding:45px 0}.section h2{font-family:Georgia,serif;font-size:42px;margin-bottom:8px}.panel{background:white;border:1px solid var(--borde);border-radius:12px;padding:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column}.full{grid-column:1/-1}.field label{font-weight:bold;font-size:13px;margin-bottom:5px}.field input,.field textarea,.search{width:100%;padding:11px;border:1px solid #ccc;border-radius:7px}.field textarea{min-height:90px}.toolbar{display:flex;gap:12px;margin:20px 0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{background:white;border:1px solid var(--borde);border-radius:12px;padding:20px}.tag{background:#f5ede0;color:var(--dorado);padding:4px 9px;border-radius:20px;font-size:12px}.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.message{color:var(--gris);min-height:25px}.card dl{display:grid;gap:8px}.card dt{font-weight:bold;font-size:12px}.card dd{margin:2px 0;font-size:13px;white-space:pre-wrap}.empty{border:1px dashed #bbb;border-radius:10px;padding:25px;text-align:center;color:var(--gris)}dialog{width:min(850px,calc(100% - 24px));max-height:85vh;border:0;border-radius:12px}dialog::backdrop{background:#0008}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:12px}.dialog-body{padding:18px;overflow:auto}iframe{width:100%;height:70vh;border:0}.close{border:0;background:none;font-size:28px;cursor:pointer}footer{text-align:center;padding:30px;color:var(--gris);background:white;border-top:1px solid var(--borde)}@media(max-width:700px){.hero h2{font-size:42px}.form-grid,.cards,.stats{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{flex-direction:column}}</style>
</head>
<body>
<header><div class="container"><div class="logo"><h1>IURISPRUDENTIA</h1></div></div></header>
<main>
<section class="hero"><div class="container"><h2>Jurisprudencia<br><span class="gold">Sala de Casación Penal — Corte Suprema de Justicia</span></h2><p class="intro">Guarda sentencias PDF y crea una minuta manual por cada providencia.</p><a class="button" href="#cargar">Cargar sentencia</a><div class="stats"><div class="stat"><strong id="count">0</strong><span>Sentencias guardadas</span></div><div class="stat"><strong id="topics">0</strong><span>Temas registrados</span></div></div></div></section>
<section class="section" id="cargar"><div class="container"><h2>Guardar sentencia y minuta</h2><form id="upload-form" class="panel"><div class="form-grid">
<div class="field"><label>Radicado o nombre *</label><input id="citation" required maxlength="160"></div><div class="field"><label>Tema principal *</label><input id="topic" required maxlength="120"></div>
<div class="field"><label>Magistrado/a ponente</label><input id="magistrate" maxlength="160"></div><div class="field"><label>Fecha de providencia</label><input id="decisionDate" type="date"></div>
<div class="field full"><label>Problema jurídico</label><textarea id="legalIssue"></textarea></div><div class="field full"><label>Temas tratados por la Corte</label><textarea id="courtTopics"></textarea></div>
<div class="field full"><label>Forma como resolvió el problema</label><textarea id="resolutionMethod"></textarea></div><div class="field full"><label>Reglas jurisprudenciales</label><textarea id="rules"></textarea></div>
<div class="field full"><label>Subtemas para consulta</label><textarea id="subtopics"></textarea></div><div class="field full"><label>Resuelve / parte resolutiva</label><textarea id="ruling"></textarea></div>
<div class="field full"><label>Archivo PDF *</label><input id="file" type="file" accept="application/pdf,.pdf" required></div></div><button class="button" id="save" type="submit">Guardar sentencia y minuta</button><p id="message" class="message"></p></form></div></section>
<section class="section" id="biblioteca"><div class="container"><h2>Biblioteca</h2><div class="toolbar"><input id="search" class="search" type="search" placeholder="Buscar por radicado, tema, magistrado o subtema"><span id="results"></span></div><div id="cards" class="cards"></div></div></section>
</main>
<footer>IURISPRUDENTIA</footer>
<dialog id="pdf-dialog"><div class="dialog-head"><h2 id="pdf-title"></h2><button class="close" id="close-pdf">×</button></div><iframe id="pdf-frame"></iframe></dialog>
<dialog id="edit-dialog"><div class="dialog-head"><h2>Editar minuta</h2><button class="close" id="close-edit">×</button></div><form id="edit-form" class="dialog-body"><input id="edit-id" type="hidden"><div class="form-grid">
<div class="field"><label>Radicado *</label><input id="edit-citation" required></div><div class="field"><label>Tema *</label><input id="edit-topic" required></div><div class="field"><label>Magistrado/a</label><input id="edit-magistrate"></div><div class="field"><label>Fecha</label><input id="edit-date" type="date"></div>
<div class="field full"><label>Problema jurídico</label><textarea id="edit-issue"></textarea></div><div class="field full"><label>Temas tratados</label><textarea id="edit-courtTopics"></textarea></div><div class="field full"><label>Forma de resolución</label><textarea id="edit-method"></textarea></div><div class="field full"><label>Reglas jurisprudenciales</label><textarea id="edit-rules"></textarea></div><div class="field full"><label>Subtemas</label><textarea id="edit-subtopics"></textarea></div><div class="field full"><label>Resuelve</label><textarea id="edit-ruling"></textarea></div></div><button class="button" type="submit">Guardar cambios</button><p id="edit-message" class="message"></p></form></dialog>
<script>
const DB='iurisprudentia',STORE='sentences',MAX=25*1024*1024;let records=[],objectUrl=null;
const fields=['magistrate','decisionDate','legalIssue','courtTopics','resolutionMethod','rules','subtopics','ruling'];
const labels={magistrate:'Magistrado/a ponente',decisionDate:'Fecha',legalIssue:'Problema jurídico',courtTopics:'Temas tratados por la Corte',resolutionMethod:'Forma como resolvió el problema',rules:'Reglas jurisprudenciales',subtopics:'Subtemas',ruling:'Resuelve'};
function openDB(){return new Promise((ok,bad)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE,{keyPath:'id'})};q.onsuccess=()=>ok(q.result);q.onerror=()=>bad(q.error)})}
async function action(mode,fn){const db=await openDB();return new Promise((ok,bad)=>{const tx=db.transaction(STORE,mode),store=tx.objectStore(STORE);let result;try{result=fn(store)}catch(e){bad(e);return}tx.oncomplete=()=>{db.close();ok(result?.result)};tx.onerror=()=>bad(tx.error);tx.onabort=()=>bad(tx.error)})}
async function load(){try{records=await action('readonly',s=>s.getAll());records.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));render()}catch(e){document.querySelector('#cards').innerHTML='<div class="empty">No se pudo abrir el almacenamiento local.</div>'}}
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);
function render(){const q=document.querySelector('#search').value.trim().toLowerCase();const found=records.filter(r=>[r.citation,r.topic,r.filename,...fields.map(k=>r[k])].join(' ').toLowerCase().includes(q));document.querySelector('#count').textContent=records.length;document.querySelector('#topics').textContent=new Set(records.map(r=>r.topic.toLowerCase())).size;document.querySelector('#results').textContent=found.length+' resultados';if(!found.length){document.querySelector('#cards').innerHTML='<div class="empty">No hay sentencias guardadas o coincidentes.</div>';return}document.querySelector('#cards').innerHTML=found.map(r=>`<article class="card"><span class="tag">${esc(r.topic)}</span><h3>${esc(r.citation)}</h3><p>${esc(r.filename)}</p><dl>${fields.map(k=>`<div><dt>${labels[k]}</dt><dd>${esc(r[k]||'Sin registrar')}</dd></div>`).join('')}</dl><div class="card-actions"><button class="button secondary" data-action="view" data-id="${r.id}">Abrir PDF</button><button class="button secondary" data-action="edit" data-id="${r.id}">Editar minuta</button><button class="button" data-action="download" data-id="${r.id}">Descargar</button><button class="button secondary" data-action="delete" data-id="${r.id}">Eliminar</button></div></article>`).join('')}
function read(prefix){const get=id=>document.querySelector(prefix+id).value.trim();return{magistrate:get('magistrate'),decisionDate:get('decisionDate'),legalIssue:get('legalIssue'),courtTopics:get('courtTopics'),resolutionMethod:get('resolutionMethod'),rules:get('rules'),subtopics:get('subtopics'),ruling:get('ruling')}}
document.querySelector('#upload-form').addEventListener('submit',async e=>{e.preventDefault();const file=document.querySelector('#file').files[0],citation=document.querySelector('#citation').value.trim(),topic=document.querySelector('#topic').value.trim(),msg=document.querySelector('#message');try{if(!file||(!file.name.toLowerCase().endsWith('.pdf')))throw new Error('Seleccione un archivo PDF.');if(file.size>MAX)throw new Error('El PDF supera 25 MB.');const record={id:crypto.randomUUID(),citation,topic,filename:file.name,file,createdAt:new Date().toISOString(),...read('')};await action('readwrite',s=>s.add(record));document.querySelector('#upload-form').reset();msg.textContent='Sentencia y minuta guardadas.';await load()}catch(e){msg.textContent=e.message}});
document.querySelector('#search').addEventListener('input',render);
document.querySelector('#cards').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const r=records.find(x=>x.id===b.dataset.id);if(!r)return;if(b.dataset.action==='delete'){if(confirm('¿Eliminar esta sentencia y su minuta?')){await action('readwrite',s=>s.delete(r.id));await load()}}if(b.dataset.action==='download'){const u=URL.createObjectURL(r.file),a=document.createElement('a');a.href=u;a.download=r.filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}if(b.dataset.action==='view'){if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(r.file);document.querySelector('#pdf-title').textContent=r.citation;document.querySelector('#pdf-frame').src=objectUrl;document.querySelector('#pdf-dialog').showModal()}if(b.dataset.action==='edit'){document.querySelector('#edit-id').value=r.id;document.querySelector('#edit-citation').value=r.citation;document.querySelector('#edit-topic').value=r.topic;document.querySelector('#edit-magistrate').value=r.magistrate||'';document.querySelector('#edit-date').value=r.decisionDate||'';document.querySelector('#edit-issue').value=r.legalIssue||'';document.querySelector('#edit-courtTopics').value=r.courtTopics||'';document.querySelector('#edit-method').value=r.resolutionMethod||'';document.querySelector('#edit-rules').value=r.rules||'';document.querySelector('#edit-subtopics').value=r.subtopics||'';document.querySelector('#edit-ruling').value=r.ruling||'';document.querySelector('#edit-dialog').showModal()}});
document.querySelector('#edit-form').addEventListener('submit',async e=>{e.preventDefault();const id=document.querySelector('#edit-id').value,r=records.find(x=>x.id===id);if(!r)return;Object.assign(r,{citation:document.querySelector('#edit-citation').value.trim(),topic:document.querySelector('#edit-topic').value.trim(),magistrate:document.querySelector('#edit-magistrate').value.trim(),decisionDate:document.querySelector('#edit-date').value,legalIssue:document.querySelector('#edit-issue').value.trim(),courtTopics:document.querySelector('#edit-courtTopics').value.trim(),resolutionMethod:document.querySelector('#edit-method').value.trim(),rules:document.querySelector('#edit-rules').value.trim(),subtopics:document.querySelector('#edit-subtopics').value.trim(),ruling:document.querySelector('#edit-ruling').value.trim()});await action('readwrite',s=>s.put(r));document.querySelector('#edit-message').textContent='Minuta actualizada.';await load();setTimeout(()=>document.querySelector('#edit-dialog').close(),400)});
function closeDialog(id){document.querySelector(id).close()}document.querySelector('#close-pdf').onclick=()=>closeDialog('#pdf-dialog');document.querySelector('#close-edit').onclick=()=>closeDialog('#edit-dialog');
load();
</script>
</body>
</html>
